# OrbitCloud Docker Compose 部署(基于已编译二进制)
# 用法:
#   1. 先运行 prep 脚本复制二进制: powershell -File prep.ps1(或 bash prep.sh)
#   2. 首次生成 .env(自动): 含 JWT/SMB 共享密钥
#   3. docker compose up -d --build
# 服务:
#   web         : Nginx 前端(静态 + /api 反代)
#   orbitcloud  : 后端 API(8080) + 内部私有 Socket(9101)
#   smb-gateway : SMB 网关(445)
#   rustfs      : S3 对象存储(9000)
services:
  postgres:
    image: postgres:16-alpine
    container_name: oc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-orbitcloud}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-orbitcloud}
      POSTGRES_DB: ${PG_DB:-orbitcloud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-orbitcloud} -d ${PG_DB:-orbitcloud}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    build: ./rustfs
    container_name: oc-rustfs
    restart: unless-stopped
    volumes:
      - rustfs-data:/opt/rustfs/data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
    ports:
      - "${PORT_S3:-9000}:9000"
    networks:
      oc-net:

  orbitcloud:
    build: ./orbitcloud
    container_name: oc-orbitcloud
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./orbitcloud/OrbitCloud.yaml:/opt/orbitcloud/config/OrbitCloud.yaml:ro
      - orbitcloud-data:/opt/orbitcloud/data
      - orbitcloud-logs:/opt/orbitcloud/logs
    ports:
      - "${PORT_API:-8080}:8080"
    networks:
      oc-net:
        ipv4_address: 172.28.0.10

  smb-gateway:
    build: ./smb-gateway
    container_name: oc-smb-gateway
    restart: unless-stopped
    depends_on:
      - orbitcloud
    volumes:
      - ./smb-gateway/config.yaml:/opt/orbitcloud/smb-gateway/config.yaml:ro
      - smb-gateway-logs:/opt/orbitcloud/smb-gateway/logs
    ports:
      - "${PORT_SMB:-1445}:445"
    networks:
      oc-net:
        ipv4_address: 172.28.0.11

  web:
    build: ./web
    container_name: oc-web
    restart: unless-stopped
    depends_on:
      - orbitcloud
    ports:
      - "${PORT_WEB:-18080}:80"
    networks:
      oc-net:

volumes:
  postgres-data:
  rustfs-data:
  orbitcloud-data:
  orbitcloud-logs:
  smb-gateway-logs:

networks:
  oc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
