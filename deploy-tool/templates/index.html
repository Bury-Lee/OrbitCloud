<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrbitCloud 部署工具</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6fa; color: #333; }
  header { background: #2f54eb; color: #fff; padding: 14px 24px; font-size: 18px; }
  .wrap { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h3 { margin: 0 0 12px; font-size: 15px; color: #2f54eb; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #eee; padding: 6px 10px; text-align: left; }
  th { background: #fafafa; }
  .ok { color: #52c41a; font-weight: 600; }
  .bad { color: #f5222d; font-weight: 600; }
  .warn { color: #faad14; font-weight: 600; }
  button { background: #2f54eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; margin: 4px 8px 4px 0; cursor: pointer; font-size: 14px; }
  button:hover { opacity: .85; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  button.red { background: #f5222d; }
  #log { background: #0d1117; color: #c9d1d9; padding: 12px; border-radius: 6px; height: 320px; overflow-y: auto;
         font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<header>OrbitCloud 部署工具 · 配置审查 / 自动部署</header>
<div class="wrap">

  <div class="card">
    <h3>环境信息</h3>
    <div id="env"></div>
  </div>

  <div class="card">
    <h3>服务与端口审查</h3>
    <table>
      <tr><th>组件</th><th>状态</th><th>端口</th><th>监听</th></tr>
      <tbody id="svc"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>配置审查</h3>
    <div id="issues"></div>
    <table><tbody id="cfg"></tbody></table>
  </div>

  <div class="card">
    <h3>一键部署</h3>
    <button onclick="deploy('all')">完整部署(编译+部署)</button>
    <button onclick="deploy('backend')">仅后端</button>
    <button onclick="deploy('smb')">仅 SMB 网关</button>
    <button onclick="deploy('frontend')">仅前端</button>
    <button class="red" onclick="deploy('restart')">重启服务</button>
    <div id="deployMsg" style="margin-top:8px;font-size:13px"></div>
    <div id="log" style="margin-top:10px"></div>
  </div>

</div>
<script>
const $ = s => document.querySelector(s);
let running = false, timer = null;

async function refresh() {
  const d = await (await fetch('/api/audit')).json();

  $('#env').innerHTML = `
    <table><tbody>
      <tr><td>主机</td><td>${d.info.hostname}</td></tr>
      <tr><td>运行时长</td><td>${d.info.uptime}</td></tr>
      <tr><td>内存</td><td>${d.info.mem}</td></tr>
      <tr><td>磁盘 /opt</td><td>${d.info.disk}</td></tr>
      <tr><td>后端版本</td><td>${d.info.orbitcloud_ver}</td></tr>
      <tr><td>pprof</td><td>${d.info.pprof === '未启用' ? '<span class="warn">未启用(后端配置 server.pprof_enabled: true 开启)</span>'
          : `<a href="${d.info.pprof}" target="_blank">${d.info.pprof}</a>`}</td></tr>
    </tbody></table>`;

  $('#svc').innerHTML = Object.entries(d.services).map(([s, st]) =>
    `<tr><td>${s}</td><td>${st === 'active' ? '<span class="ok">● active</span>' : `<span class="bad">● ${st || 'inactive'}</span>`}</td>
     <td></td><td></td></tr>`).join('') +
    Object.entries(d.ports).map(([p, on]) =>
    `<tr><td></td><td></td><td>${p}</td><td>${on ? '<span class="ok">● 监听中</span>' : '<span class="bad">● 未监听</span>'}</td></tr>`).join('');

  $('#issues').innerHTML = d.issues.length
    ? `<div style="margin-bottom:10px">${d.issues.map(i => `<div class="bad">⚠ ${i}</div>`).join('')}</div>`
    : '<div class="ok">✓ 未发现配置问题</div>';

  $('#cfg').innerHTML = Object.entries(d.items).map(([k, v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

async function deploy(target) {
  if (running) return;
  running = true;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  $('#deployMsg').textContent = '任务执行中...';
  const r = await (await fetch('/api/deploy', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target }) })).json();
  if (!r.ok) { $('#deployMsg').textContent = r.msg; running = false; enableBtns(); return; }
  $('#log').textContent = '等待日志...';
  timer = setInterval(pollLog, 1500);
}

async function pollLog() {
  const s = await (await fetch('/api/deploy/status')).json();
  $('#log').textContent = s.log;
  $('#log').scrollTop = $('#log').scrollHeight;
  if (!s.running) {
    clearInterval(timer);
    $('#deployMsg').textContent = s.exit === 0 ? '✅ 部署完成' : `❌ 部署失败(退出码 ${s.exit})`;
    running = false;
    enableBtns();
    refresh();
  }
}

function enableBtns() { document.querySelectorAll('button').forEach(b => b.disabled = false); }

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
